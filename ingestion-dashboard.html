<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DetectLab · Ingestion Control</title><style>
:root{color-scheme:dark;--gold:#c99a52;--ink:#090d14;--panel:#121822;--line:#293444;--muted:#8f9aaa;--green:#79bd82;--red:#d97868}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1d1b16,transparent 30%),var(--ink);color:#e8e3d9;font:14px system-ui,sans-serif}main{width:min(1180px,calc(100% - 32px));margin:32px auto}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}h1{margin:5px 0 0;font:600 27px Georgia,serif;color:#f2d9a6}header small,.eyebrow{color:var(--gold);letter-spacing:.15em}.source{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card,.panel{border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,rgba(201,154,82,.06),var(--panel));padding:15px}.card b{display:block;font:600 25px Georgia;color:#f1dcb4}.card span{color:var(--muted);font-size:12px}.wide{grid-column:span 2}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.controls input,.controls select,.controls button{height:38px;border:1px solid var(--line);border-radius:5px;background:#0c1119;color:#ddd;padding:0 11px}.controls input{min-width:260px}.controls button{border-color:#785a30;color:#e7c789;cursor:pointer}.controls button:hover{background:#20180e}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel h2{margin:0 0 12px;font:600 16px Georgia;color:#dec18b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #202a37;font-size:12px}th{color:#8d98a7}.bar{height:5px;border-radius:5px;background:#27303c;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.badge{padding:3px 6px;border-radius:99px;background:#202b38;font-size:10px}.badge.RUNNING{color:#8ed39a}.badge.FAILED{color:var(--red)}#message{min-height:20px;color:#d6b875}.guard{display:inline-flex;gap:6px;align-items:center;color:var(--green);font-size:12px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column;gap:8px}}
</style></head><body><main><header><div><small>DETECTLAB · ADMINISTRATION</small><h1>National Archaeological Ingestion</h1></div><div><span class="guard">● Structured records only</span><div class="source">PDF copies stored: <b>0</b></div></div></header><section class="cards" id="cards"></section><section class="panel"><span class="eyebrow">WORKER CONTROL</span><div class="controls"><input id="key" type="password" placeholder="Ingestion admin key"><select id="type"><option>PILOT</option><option>INCREMENTAL</option><option>NATIONAL</option></select><input id="county" placeholder="County scope (optional)"><button id="start">Start resumable run</button><button id="refresh">Refresh</button></div><div id="message"></div></section><div class="grid"><section class="panel"><h2>Progress by county</h2><table><thead><tr><th>County</th><th>Progress</th><th>Processed</th><th>Failed</th></tr></thead><tbody id="counties"></tbody></table></section><section class="panel"><h2>Recent extraction runs</h2><table><thead><tr><th>Run</th><th>Status</th><th>Progress</th><th>Action</th></tr></thead><tbody id="runs"></tbody></table></section></div></main><script>
const API=(window.DETECTLAB_API_BASE||'https://detectlab-backend-production.up.railway.app/api');const fmt=n=>Number(n||0).toLocaleString('ro-RO');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function request(path,opt={}){const r=await fetch(API+path,opt),d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}async function load(){try{const d=await request('/ingestion/status');const metrics=[['Localități',d.total_localities],['Procesate',d.localities_processed],['Rămase',d.localities_remaining],['Documente descoperite',d.documents_discovered],['Documente procesate',d.documents_processed],['Claim-uri',d.archaeological_claims],['Dovezi',d.evidence_records],['OCR / eșec / review',`${d.ocr_required} / ${d.failed_documents} / ${d.review_required}`]];cards.innerHTML=metrics.map(x=>`<div class="card"><b>${fmt(x[1])}</b><span>${x[0]}</span></div>`).join('');counties.innerHTML=d.counties.map(c=>{let p=c.total?Math.round(c.processed*100/c.total):0;return `<tr><td>${esc(c.county)}</td><td><div class="bar"><i style="width:${p}%"></i></div></td><td>${c.processed} / ${c.total}</td><td>${c.failed}</td></tr>`}).join('');runs.innerHTML=d.runs.map(r=>`<tr><td><small>${esc(r.run_type)}</small><br>${esc(String(r.id).slice(0,8))}</td><td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td>${r.processed_localities}/${r.total_localities}</td><td>${r.status==='RUNNING'?`<button onclick="act('${r.id}','pause')">Pause</button>`:r.status==='PAUSED'?`<button onclick="act('${r.id}','resume')">Resume</button>`:''}</td></tr>`).join('')}catch(e){message.textContent=e.message}}async function act(id,action){try{await request(`/ingestion/runs/${id}/${action}`,{method:'POST',headers:{'x-ingestion-key':key.value}});load()}catch(e){message.textContent=e.message}}start.onclick=async()=>{try{let body={type:type.value};if(county.value)body.county=county.value;let r=await request('/ingestion/runs',{method:'POST',headers:{'Content-Type':'application/json','x-ingestion-key':key.value},body:JSON.stringify(body)});message.textContent=`Run ${r.id} queued with ${r.total_localities} localities.`;load()}catch(e){message.textContent=e.message}};refresh.onclick=load;load();setInterval(load,15000);
</script></body></html>
